<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel</title>
<link rel="icon" href="/logo.png">
<style>
:root {
  color-scheme: light;
  --plane: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee; --hover: #ecebe6;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,.10);
  --accent: #8c1d2f; --accent-ink: #ffffff; --accent-soft: #f6e8ea;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --seq-0: #f0efec; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95; --seq-7: #0d366b;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --good-ink: #006300;
  --user-bubble: #eef3fb;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --hover: #2a2a28;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10);
    --accent: #c8475e; --accent-ink: #ffffff; --accent-soft: #3a1c22;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --seq-0: #383835; --seq-1: #104281; --seq-2: #184f95; --seq-3: #1c5cab; --seq-4: #256abf; --seq-5: #2a78d6; --seq-6: #5598e7; --seq-7: #9ec5f4;
    --good-ink: #0ca30c; --user-bubble: #1d2633;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --hover: #2a2a28;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10);
  --accent: #c8475e; --accent-ink: #ffffff; --accent-soft: #3a1c22;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --seq-0: #383835; --seq-1: #104281; --seq-2: #184f95; --seq-3: #1c5cab; --seq-4: #256abf; --seq-5: #2a78d6; --seq-6: #5598e7; --seq-7: #9ec5f4;
  --good-ink: #0ca30c; --user-bubble: #1d2633;
  --shadow: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--plane); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.app { display: grid; grid-template-columns: 220px 1fr; height: 100vh; }
/* rail */
.rail { background: var(--surface); border-right: 1px solid var(--ring); display: flex; flex-direction: column; padding: 14px 10px; gap: 4px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.brand img { width: 34px; height: 34px; object-fit: contain; border-radius: 8px; background: #fff; padding: 2px; }
.brand b { font-size: 17px; letter-spacing: -.01em; }
.brand small { display: block; color: var(--muted); font-size: 11px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 0; background: none; text-align: left; color: var(--ink-2); width: 100%; }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav[hidden] { display: none; }
.nav:hover { background: var(--hover); color: var(--ink); }
.nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.rail .spacer { flex: 1; }
.rail-foot { display: flex; gap: 6px; padding: 8px 4px 0; border-top: 1px solid var(--ring); }
.rail-foot select, .icon-btn { background: var(--surface-2); border: 1px solid var(--ring); border-radius: 8px; padding: 6px 8px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.icon-btn svg { width: 16px; height: 16px; }
/* main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--ring); background: var(--surface); min-height: 56px; flex-wrap: wrap; }
.topbar .model { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
.topbar .sub { color: var(--muted); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--ring); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--good); } .dot.busy { background: var(--warning); animation: pulse 1s infinite; } .dot.err { background: var(--critical); }
@keyframes pulse { 50% { opacity: .35; } }
.topbar .grow { flex: 1; }
.meter { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.meter .track { width: 120px; height: 6px; border-radius: 3px; background: var(--seq-1); overflow: hidden; }
.meter .fill { height: 100%; background: var(--seq-5); border-radius: 3px; }
.view { flex: 1; overflow: auto; min-height: 0; }
.page { padding: 24px; max-width: 1200px; margin: 0 auto; }
.page h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
.page .lede { color: var(--ink-2); margin: 0 0 20px; max-width: 760px; }
.grid { display: grid; gap: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
.tile .value.hero { font-size: 48px; line-height: 1.1; }
.tile .note { color: var(--muted); font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-size: 14px; margin: 0 0 2px; }
.card .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
.cols-2 { grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); margin: 8px 0 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw.line { height: 2px; width: 14px; border-radius: 1px; }
.sw.hollow { background: transparent !important; box-shadow: inset 0 0 0 2px var(--seq-3); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
th { color: var(--ink-2); font-weight: 500; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow: auto; max-height: 360px; }
details > summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; margin-top: 10px; }
pre { background: var(--surface-2); border: 1px solid var(--ring); border-radius: 8px; padding: 12px; overflow: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; }
.warn { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--ring); font-size: 12.5px; margin-top: 8px; }
.warn svg { width: 16px; height: 16px; flex: none; color: var(--warning); margin-top: 2px; }
/* bars */
.hbar { display: flex; height: 22px; gap: 2px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.hbar > div { height: 100%; min-width: 2px; position: relative; }
.hbar > div:hover { filter: brightness(1.12); }
.limit-note { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 4px; }
/* layer map */
.lmap { display: grid; gap: 2px; align-items: center; }
.lmap .rowlabel { color: var(--muted); font-size: 11px; padding-right: 6px; white-space: nowrap; }
.cell { height: 18px; border-radius: 3px; position: relative; outline-offset: 1px; }
.cell:hover, .cell:focus { outline: 2px solid var(--ink); }
.cell.inflight::after { content: ""; position: absolute; inset: 0; border-radius: 3px; box-shadow: inset 0 0 0 2px var(--ink); animation: pulse .8s infinite; }
.cell.inring { box-shadow: inset 0 0 0 2px var(--ink); }
.cell.ext { background: repeating-linear-gradient(45deg, var(--seq-2) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--seq-3); }
.axis-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 4px; }
/* expert heatmap */
.emap { display: grid; gap: 1px; }
.ecell { aspect-ratio: 1; border-radius: 2px; min-width: 3px; }
.ecell.hollow { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--seq-3); }
.ecell.flash { box-shadow: 0 0 0 2px var(--accent); position: relative; z-index: 1; }
.ecell:hover { outline: 2px solid var(--ink); position: relative; z-index: 2; }
/* charts */
.chart { width: 100%; height: 220px; display: block; }
.chart text { fill: var(--muted); font-size: 11px; }
.empty-chart { color: var(--muted); font-size: 13px; padding: 30px 0; text-align: center; }
#tip { position: fixed; pointer-events: none; z-index: 50; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); display: none; max-width: 280px; }
#tip .row { display: flex; align-items: center; gap: 8px; }
#tip .row b { font-size: 13px; }
#tip .k { width: 12px; height: 2px; border-radius: 1px; }
#tip .t { color: var(--ink-2); margin-bottom: 4px; }
/* chat */
.chat { display: grid; grid-template-columns: 240px 1fr; height: 100%; min-height: 0; }
.convs { border-right: 1px solid var(--ring); padding: 12px; overflow: auto; background: var(--surface); }
.convs .new { width: 100%; justify-content: flex-start; margin-bottom: 10px; background: var(--accent); color: var(--accent-ink); border: 0; padding: 8px 10px; border-radius: 8px; }
.conv { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 8px; color: var(--ink-2); font-size: 13px; }
.conv:hover { background: var(--hover); }
.conv[aria-current="true"] { background: var(--surface-2); color: var(--ink); }
.conv span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.conv button { border: 0; background: none; color: var(--muted); padding: 2px; opacity: 0; }
.conv:hover button { opacity: 1; }
.convo { display: flex; flex-direction: column; min-height: 0; }
.msgs { flex: 1; overflow: auto; padding: 24px; }
.msgs-inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.msg { display: flex; flex-direction: column; gap: 4px; }
.msg.user { align-items: flex-end; }
.msg .bubble { max-width: 100%; overflow-wrap: anywhere; }
.msg.user .bubble { background: var(--user-bubble); border-radius: 14px 14px 4px 14px; padding: 9px 14px; white-space: pre-wrap; max-width: 85%; }
.msg.assistant .bubble { padding: 2px 2px; }
.msg.assistant .bubble p { margin: 0 0 10px; }
.msg.assistant .bubble pre { margin: 8px 0; }
.msg.assistant .bubble h3, .msg.assistant .bubble h4 { margin: 12px 0 6px; }
.msg.assistant .bubble ul, .msg.assistant .bubble ol { margin: 0 0 10px; padding-left: 22px; }
.msg .meta { color: var(--muted); font-size: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.msg .meta button { border: 0; background: none; color: var(--muted); padding: 0; display: inline-flex; gap: 4px; align-items: center; font-size: 12px; }
.msg .meta button:hover { color: var(--ink); }
.msg .meta svg { width: 13px; height: 13px; }
.think { border-left: 2px solid var(--axis); padding-left: 10px; color: var(--ink-2); margin-bottom: 10px; }
.think summary { margin: 0; }
.cursor::after { content: "▍"; animation: pulse 1s infinite; color: var(--accent); }
.err-msg { color: var(--critical); display: flex; gap: 6px; align-items: center; }
.welcome { text-align: center; margin: 12vh auto 0; max-width: 560px; color: var(--ink-2); }
.welcome img { width: 96px; height: 96px; object-fit: contain; }
.welcome h2 { color: var(--ink); margin: 8px 0; font-size: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
.chip { border: 1px solid var(--ring); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--ink-2); }
.chip:hover { background: var(--hover); color: var(--ink); }
.composer { padding: 12px 24px 18px; }
.composer-inner { max-width: 820px; margin: 0 auto; background: var(--surface); border: 1px solid var(--ring); border-radius: 14px; padding: 8px; box-shadow: var(--shadow); }
.composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; padding: 6px 8px; max-height: 220px; min-height: 44px; }
.composer .row { display: flex; align-items: center; gap: 8px; }
.composer .row .grow { flex: 1; }
.composer .hint { color: var(--muted); font-size: 12px; }
.send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 7px 14px; display: inline-flex; align-items: center; gap: 6px; }
.send:disabled { opacity: .45; cursor: default; }
.send svg { width: 16px; height: 16px; }
.settings-pop { display: none; gap: 10px; padding: 10px 8px 4px; border-top: 1px solid var(--grid); margin-top: 6px; grid-template-columns: 1fr 140px 140px; }
.settings-pop.open { display: grid; }
.settings-pop label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }
.settings-pop input, .settings-pop textarea { background: var(--surface-2); border: 1px solid var(--ring); border-radius: 6px; padding: 6px 8px; }
.settings-pop textarea { min-height: 38px; resize: vertical; }
.snip { position: relative; }
.snip .copy { position: absolute; top: 8px; right: 8px; }
.tabs { display: flex; gap: 4px; margin-bottom: 8px; }
.tab { border: 1px solid var(--ring); background: var(--surface-2); border-radius: 8px; padding: 4px 10px; font-size: 12.5px; color: var(--ink-2); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.offline { margin: 40px auto; max-width: 520px; text-align: center; color: var(--ink-2); }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 18px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.field input, .field select { background: var(--surface-2); border: 1px solid var(--ring); border-radius: 8px; padding: 7px 9px; color: var(--ink); }
.field small { color: var(--muted); font-size: 11.5px; }
.switch { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: var(--ink); cursor: pointer; }
.switch input { width: 34px; height: 20px; appearance: none; background: var(--axis); border-radius: 999px; position: relative; flex: none; cursor: pointer; margin: 1px 0 0; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { left: 16px; }
.switch small { display: block; color: var(--muted); font-size: 11.5px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn { border: 1px solid var(--ring); background: var(--surface-2); border-radius: 9px; padding: 8px 14px; font-weight: 500; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--critical); }
.btn:disabled { opacity: .45; cursor: default; }
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--ring); margin-bottom: 16px; font-size: 13px; }
.banner .grow { flex: 1; }
.banner.err { border-color: var(--critical); }
.preview { margin-top: 14px; }
.log { max-height: 260px; overflow: auto; white-space: pre-wrap; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 8px; }
.pill.clickable { cursor: pointer; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .rail { order: 2; flex-direction: row; border-right: 0; border-top: 1px solid var(--ring); padding: 6px; overflow-x: auto; }
  .brand, .rail .spacer, .rail-foot { display: none; }
  .nav { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 8px; width: auto; min-width: 64px; align-items: center; }
  .chat { grid-template-columns: 1fr; }
  .convs { display: none; }
  .page { padding: 16px; }
  .msgs, .composer { padding-left: 16px; padding-right: 16px; }
  .settings-pop { grid-template-columns: 1fr; }
  .topbar .model { max-width: 60vw; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="brand"><img src="/logo.png" alt=""><div><b>Kestrel</b><small data-i18n="brand.sub"></small></div></div>
    <button class="nav" data-view="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span data-i18n="nav.chat"></span></button>
    <button class="nav" data-view="memory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/><path d="M7 7h.01M7 17h.01"/></svg><span data-i18n="nav.memory"></span></button>
    <button class="nav" data-view="experts" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span data-i18n="nav.experts"></span></button>
    <button class="nav" data-view="performance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg><span data-i18n="nav.performance"></span></button>

// ---------------------------------------------------------------- markdown (safe)
function esc(x) { return x.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function inline(x) {

    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")

function markdown(src) {

  parts.forEach((part, i) => {
    if (i % 2 === 1) { const nl = part.indexOf("\n"); const code = nl >= 0 ? part.slice(nl + 1) : part; out.push("<pre><code>" + esc(code.replace(/\n$/, "")) + "</code></pre>"); return; }
    const lines = esc(part).split("\n"); let list = null, para = [];
    const flush = () => { if (para.length) { out.push("<p>" + inline(para.join("<br>")) + "</p>"); para = []; } if (list) { out.push("</" + list + ">"); list = null; } };
    for (const line of lines) {
      let mm;
      if ((mm = line.match(/^(#{1,4})\s+(.*)$/))) { flush(); out.push("<h4>" + inline(mm[2]) + "</h4>"); }
      else if ((mm = line.match(/^\s*[-*+]\s+(.*)$/))) { if (para.length) { out.push("<p>" + inline(para.join("<br>")) + "</p>"); para = []; } if (list !== "ul") { if (list) out.push("</" + list + ">"); out.push("<ul>"); list = "ul"; } out.push("<li>" + inline(mm[1]) + "</li>"); }
      else if ((mm = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (para.length) { out.push("<p>" + inline(para.join("<br>")) + "</p>"); para = []; } if (list !== "ol") { if (list) out.push("</" + list + ">"); out.push("<ol>"); list = "ol"; } out.push("<li>" + inline(mm[1]) + "</li>"); }
      else if (!line.trim()) flush();
      else { if (list) { out.push("</" + list + ">"); list = null; } para.push(line); }
    }
    flush();
  });
  return out.join("");
}
function renderAssistant(el, text, streaming) {

  if (m) {
    const d = h("details", { class: "think", open: streaming && !m[2] ? true : null }, h("summary", { text: t("chat.reasoning") }));
    const body = h("div", {}); body.innerHTML = markdown(m[1].trim()); d.append(body); el.append(d);
    rest = rest.slice(m[0].length);

  const main = h("div", {}); main.innerHTML = markdown(rest.replace(/^\s+/, ""));

}
